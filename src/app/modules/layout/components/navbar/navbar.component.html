<div class="flex h-14 items-center bg-[var(--tui-background-neutral-1)] px-4">
  <div class="flex items-center lg:w-64">
    <div class="flex justify-center">
      <button tuiIconButton appearance="flat" size="s" class="!flex lg:!hidden !rounded-full" iconStart="@tui.align-justify" (click)="toggleMobileSidebar()">Mobile</button>
    </div>
    <div class="hidden lg:flex flex-1 items-center">
      <b class="text-sm font-bold mr-1">eBizBase</b>
      <span>Account</span>
    </div>
  </div>
  <div class="flex-1 flex justify-between">
    <div class="flex-1 flex items-center pr-16">     
    </div>
    <div>
      <div class="flex w-full items-center justify-center gap-3">   
        <tui-badged-content>
          <tui-badge-notification size="s" tuiSlot="top">8</tui-badge-notification>
          <button tuiIconButton class="!rounded-full" 
            appearance="flat" 
            size="m"  
            iconStart="@tui.bell"
            (click)="toogleNotificatonMenu()"
            [tuiDropdown]="notification"
            [tuiDropdownManual]="notificationMenuOpened" 
            ></button>
        </tui-badged-content> 

        <tui-avatar [src]="'https://avatars.githubusercontent.com/u/11832552' | tuiFallbackSrc: '@tui.user' | async" 
         size="m"
        (click)="toogleUserMenu()"
        [tuiDropdown]="userMenu"  
        [tuiDropdownManual]="userMenuOpened"  />    
      </div>        
    </div>
  </div>
</div>
<div class="inset-x-0 inset-y-0 transition-all duration-750 backdrop-blur-[0px]" [ngClass]="{'!fixed lg:!hidden backdrop-blur-[2px]': layoutService.mobileSidebar}" (click)="toggleMobileSidebar()"></div>
<div class="inset-x-0 inset-y-0 transition-all duration-750 bg-black dark:bg-white opacity-0" [ngClass]="{'!fixed lg:!hidden opacity-20': layoutService.mobileSidebar}" (click)="toggleMobileSidebar()"></div>
<ng-template #userMenu>
  <div class="w-screen max-w-md bg-[var(--tui-background-neutral-1)] p-8">

   <div class="flex flex-col items-center">
    <tui-avatar [src]="'https://avatars.githubusercontent.com/u/11832552' | tuiFallbackSrc: '@tui.user' | async"  size="xl" /> 
    <div class="text-2xl">Hi John Doe!</div>
    <div class="text">john.itvn&#64;gmail.com</div>
   </div>  
   
   
   <div class="flex justify-between w-full border rounded-full bg-[var(--tui-background-base)] mt-8">
      <div class="flex-1 p-4 space-x-2 border-r">
        <tui-icon icon="@tui.mail" />
        <span>Your profile</span>        
      </div>
      <div class="flex-1 p-4 space-x-2">
        <tui-icon icon="@tui.mail" />
        <span>Logout</span>        
      </div>
   </div>


    <div class="flex items-center mt-8" >
      <span class="flex-1">Color Mode</span>
      <tui-segmented size="m" [style.border-radius.rem]="10">
        <button type="button">Light</button>
        <button type="button">Dark</button>
        <button type="button">System</button>
      </tui-segmented>
    </div>
  </div>
</ng-template>    
<ng-template #notification>
  <div class="dropdown">Notification</div>
</ng-template>
